<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gomoku - Natural Wood</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('https://images.unsplash.com/photo-1544333346-647a9fdba201?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80');
            background-size: cover;
            background-position: center;
        }
        .wood-panel {
            background: rgba(43, 24, 16, 0.85);
            border: 8px solid #3d2b1f;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            color: #d4a373;
        }
        .wood-btn {
            background: #5c4033;
            border: 2px solid #3d2b1f;
            box-shadow: 0 4px 0 #2b1d12;
            transition: all 0.1s;
        }
        .wood-btn:hover { background: #6b4d3f; }
        .wood-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #2b1d12; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="wood-panel w-full max-w-md p-10 text-center rounded-sm">
        <h1 class="text-5xl font-serif font-bold mb-4">Gomoku</h1>
        <div class="h-px bg-[#d4a373] opacity-30 mb-12"></div>

        <div class="space-y-6 font-serif tracking-widest uppercase">
            <button class="wood-btn w-full py-4 text-xl">New Match</button>
            <button class="wood-btn w-full py-4 text-xl">Records</button>
            <button class="wood-btn w-full py-4 text-xl">Rules</button>
        </div>

        <div class="mt-16 flex justify-center space-x-12 opacity-50">
            <div class="w-8 h-8 rounded-full bg-white shadow-lg"></div>
            <div class="w-8 h-8 rounded-full bg-black shadow-lg"></div>
        </div>
    </div>
</body>
</html>
