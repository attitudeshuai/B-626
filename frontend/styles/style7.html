<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gomoku - Neumorphism</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #e0e5ec; color: #444; }
        .neu-flat {
            border-radius: 30px;
            background: #e0e5ec;
            box-shadow: 20px 20px 60px #bec3c9, -20px -20px 60px #ffffff;
        }
        .neu-btn {
            border-radius: 20px;
            background: #e0e5ec;
            box-shadow: 10px 10px 20px #bec3c9, -10px -10px 20px #ffffff;
            transition: all 0.2s ease;
        }
        .neu-btn:active {
            box-shadow: inset 5px 5px 10px #bec3c9, inset -5px -5px 10px #ffffff;
        }
        .neu-icon {
            color: #444;
            text-shadow: 1px 1px 2px rgba(255,255,255,1), -1px -1px 2px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="neu-flat w-full max-w-sm p-12 text-center">
        <div class="neu-btn w-24 h-24 mx-auto mb-10 flex items-center justify-center">
            <i class="fa-solid fa-shapes text-3xl neu-icon"></i>
        </div>

        <h1 class="text-3xl font-bold mb-12 neu-icon">五子棋棋阵</h1>

        <div class="space-y-8">
            <button class="neu-btn w-full py-5 font-bold neu-icon">单人练习</button>
            <button class="neu-btn w-full py-5 font-bold neu-icon">多人对弈</button>
            <div class="flex justify-center space-x-8 mt-12">
                <button class="neu-btn w-14 h-14 flex items-center justify-center"><i class="fa-solid fa-gear"></i></button>
                <button class="neu-btn w-14 h-14 flex items-center justify-center"><i class="fa-solid fa-bell"></i></button>
                <button class="neu-btn w-14 h-14 flex items-center justify-center"><i class="fa-solid fa-user"></i></button>
            </div>
        </div>
    </div>
</body>
</html>
