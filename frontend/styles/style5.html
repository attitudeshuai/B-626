<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gomoku - 8-Bit Retro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Press Start 2P', cursive; }
        .pixel-border {
            border: 4px solid #fff;
            box-shadow: 8px 8px 0px #555;
            image-rendering: pixelated;
        }
        .pixel-btn {
            background-color: #f00;
            padding: 10px;
            border: 4px solid #fff;
            box-shadow: 4px 4px 0px #800;
            transition: transform 0.1s;
        }
        .pixel-btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #000; }
        .blink { animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="pixel-border p-8 text-center max-w-sm w-full bg-[#222]">
        <h1 class="text-2xl mb-4 text-yellow-400">GOMOKU</h1>
        <div class="text-[10px] mb-12">PLAYER 1 START!</div>

        <div class="space-y-6">
            <button class="pixel-btn w-full text-[12px]">NEW GAME</button>
            <button class="pixel-btn w-full text-[12px] bg-blue-600 shadow-blue-900">CONTINUE</button>
            <button class="pixel-btn w-full text-[12px] bg-green-600 shadow-green-900">SETTINGS</button>
        </div>

        <div class="mt-12 text-[8px] blink text-gray-400">INSERT COIN TO PLAY</div>
    </div>
</body>
</html>
