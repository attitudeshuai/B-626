<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gomoku - Glassmorphism</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
            min-height: screen;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen p-4 flex items-center justify-center">
    <div class="glass w-full max-w-md p-10 text-white text-center">
        <div class="w-20 h-20 bg-white bg-opacity-30 rounded-full mx-auto mb-8 flex items-center justify-center shadow-inner">
            <i class="fa-solid fa-chess-board text-3xl"></i>
        </div>

        <h1 class="text-4xl font-bold mb-2">Gomoku Pro</h1>
        <p class="text-white text-opacity-60 mb-12">体验极致指尖博弈</p>

        <div class="space-y-4">
            <button class="glass-btn w-full py-4 rounded-2xl font-semibold text-lg">快速开始</button>
            <div class="grid grid-cols-2 gap-4">
                <button class="glass-btn py-4 rounded-2xl font-semibold">好友对战</button>
                <button class="glass-btn py-4 rounded-2xl font-semibold">智能 AI</button>
            </div>
            <button class="glass-btn w-full py-4 rounded-2xl font-semibold">排行榜</button>
        </div>

        <div class="mt-12 flex justify-center space-x-6 opacity-60">
            <i class="fa-solid fa-user-group cursor-pointer hover:opacity-100"></i>
            <i class="fa-solid fa-trophy cursor-pointer hover:opacity-100"></i>
            <i class="fa-solid fa-gear cursor-pointer hover:opacity-100"></i>
        </div>
    </div>
</body>
</html>
