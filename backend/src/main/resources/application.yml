server:
  port: 8000

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/gomoku?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      encoding: UTF-8

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: gomoku-secret-key-for-jwt-token-generation-2024-must-be-long-enough
  expiration: 86400000

logging:
  level:
    com.gomoku: DEBUG
